<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#065f46" />
    <title>Offline — Aalim</title>
    <!--
      Deliberately a plain, self-contained HTML file rather than a Next
      route. A Next page needs its JS chunks to hydrate, and the offline
      page is by definition never visited while online, so those chunks
      are never in the cache and hydration fails with a client-side
      exception. No script, no external CSS, no dependency on the build.
    -->
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 2.5rem 1.25rem;
        padding-top: calc(2.5rem + env(safe-area-inset-top, 0px));
        padding-bottom: calc(2.5rem + env(safe-area-inset-bottom, 0px));
        background: #f5f1e8;
        color: #171717;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      img { width: 72px; height: 72px; opacity: 0.6; margin-bottom: 0.5rem; }
      h1 { margin: 0; font-size: 1.25rem; color: #064e3b; }
      p { margin: 0; max-width: 20rem; font-size: 0.875rem; line-height: 1.6; color: #3f3f46; }
      p.small { font-size: 0.75rem; color: #6b7280; }
      a {
        margin-top: 1.25rem;
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        padding: 0 1.75rem;
        border-radius: 9999px;
        background: #065f46;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <img src="/AALIM.png" alt="" />
    <h1>You&rsquo;re offline</h1>
    <p>
      Aalim needs an internet connection to search the Qur&rsquo;an and Hadith
      and to load your saved conversations.
    </p>
    <p class="small">
      Reconnect and try again — your conversations are saved to your account,
      so nothing is lost.
    </p>
    <a href="/chat">Try again</a>
  </body>
</html>
